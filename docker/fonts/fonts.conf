<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  В образе лежат статические начертания: Montserrat ExtraBold и Inter Black.
  fontconfig видит их как family=Montserrat style=ExtraBold и family=Inter style=Black,
  поэтому запрос "Montserrat ExtraBold" (именно так шрифт назван в config.yaml и в .ass)
  без этих правил уходил бы в DejaVu Sans. libass подставляет fallback молча — субтитры
  отрендерились бы чужим шрифтом. Алиасы закрепляют ожидаемое соответствие.
-->
<fontconfig>
  <match target="pattern">
    <test qual="any" name="family">
      <string>Montserrat ExtraBold</string>
    </test>
    <edit name="family" mode="assign" binding="same">
      <string>Montserrat</string>
    </edit>
  </match>

  <match target="pattern">
    <test qual="any" name="family">
      <string>Inter Black</string>
    </test>
    <edit name="family" mode="assign" binding="same">
      <string>Inter</string>
    </edit>
  </match>
</fontconfig>
