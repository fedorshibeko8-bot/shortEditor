[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shorteditor"
version = "0.1.0"
description = "Telegram bot for Twitch clip editing and publishing"
requires-python = ">=3.11"
dependencies = [
  "aiohttp>=3.9,<4",
  "aiosqlite>=0.20,<1",
  "aiogram>=3,<4",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.9,<3",
  "PyYAML>=6.0,<7",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<10",
  "pytest-asyncio>=1,<2",
]
dev = [
  "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
