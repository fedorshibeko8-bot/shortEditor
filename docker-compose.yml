services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      TZ: ${TZ:-Europe/Moscow}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./models:/models
    command: ["sleep", "infinity"]
